<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090A0D">
    <title>Buat Link Undangan Tamu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: #090A0D;
            color: #F5F5F5;
            font-family: Inter, sans-serif;
        }

        main {
            width: min(100%, 480px);
            padding: 32px;
            border: 1px solid rgba(197, 201, 208, 0.22);
            border-radius: 20px;
            background: rgba(17, 19, 24, 0.92);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #E31837;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-align: center;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(26px, 7vw, 34px);
            text-align: center;
        }

        .description {
            margin: 14px 0 28px;
            color: rgba(197, 201, 208, 0.8);
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #C5C9D0;
            font-size: 13px;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid rgba(197, 201, 208, 0.28);
            border-radius: 10px;
            outline: none;
            background: #090A0D;
            color: #F5F5F5;
            font: inherit;
        }

        input:focus {
            border-color: #E31837;
            box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.16);
        }

        button, .back-link {
            min-height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .generate-button {
            width: 100%;
            margin-top: 14px;
            border: 0;
            background: #E31837;
            color: white;
        }

        .generate-button:hover {
            background: #c91630;
        }

        .result {
            margin-top: 24px;
        }

        .result[hidden] {
            display: none;
        }

        .result label {
            margin-top: 20px;
        }

        .result-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .copy-button {
            border: 1px solid rgba(197, 201, 208, 0.35);
            background: transparent;
            color: #F5F5F5;
        }

        .copy-button:hover, .back-link:hover {
            border-color: #E31837;
            color: white;
        }

        .open-link {
            border: 1px solid rgba(197, 201, 208, 0.35);
            color: #C5C9D0;
        }

        .whatsapp-link {
            border: 1px solid #25D366;
            background: #128C4A;
            color: white;
        }

        .whatsapp-link:hover {
            background: #0f743e;
        }

        .status {
            min-height: 20px;
            margin: 12px 0 0;
            color: #C5C9D0;
            font-size: 12px;
            text-align: center;
        }

        .back-link {
            width: 100%;
            margin-top: 12px;
            border: 1px solid transparent;
            color: rgba(197, 201, 208, 0.72);
        }

        @media (max-width: 420px) {
            main {
                padding: 26px 20px;
            }

            .result-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Undangan Wisuda</p>
        <h1>Buat Link Tamu</h1>
        <p class="description">Masukkan nama tamu untuk membuat link undangan personal. Nama tersebut akan tampil di halaman pembuka undangan.</p>

        <form id="link-form">
            <label for="guest-name">Nama tamu</label>
            <input id="guest-name" name="guestName" type="text" placeholder="Contoh: Bapak Ahmad" autocomplete="name" maxlength="100" required>
            <button class="generate-button" type="submit">Buat Link Undangan</button>
        </form>

        <section id="link-result" class="result" aria-live="polite" hidden>
            <label for="generated-link">Link undangan personal</label>
            <input id="generated-link" type="text" readonly>
            <div class="result-actions">
                <button id="copy-button" class="copy-button" type="button">Salin Link</button>
                <a id="whatsapp-share" class="back-link whatsapp-link" href="#" target="_blank" rel="noopener noreferrer">Bagikan ke WhatsApp</a>
                <a id="open-link" class="back-link open-link" href="#" target="_blank" rel="noopener noreferrer">Buka Link</a>
            </div>
            <p id="status-message" class="status" role="status"></p>
        </section>

        <a id="back-link" class="back-link" href="index.html">Kembali ke Undangan</a>
    </main>

    <script>
        const form = document.getElementById('link-form');
        const guestNameInput = document.getElementById('guest-name');
        const result = document.getElementById('link-result');
        const generatedLinkInput = document.getElementById('generated-link');
        const copyButton = document.getElementById('copy-button');
        const whatsappShare = document.getElementById('whatsapp-share');
        const openLink = document.getElementById('open-link');
        const statusMessage = document.getElementById('status-message');

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const guestName = guestNameInput.value.trim();

            if (!guestName) {
                guestNameInput.focus();
                return;
            }

            const invitationUrl = new URL('index.html', window.location.href);
            invitationUrl.search = '';
            invitationUrl.hash = '';
            invitationUrl.searchParams.set('to', guestName);

            generatedLinkInput.value = invitationUrl.href;
            openLink.href = invitationUrl.href;
            const invitationMessage = [
                'Assalamualaikum wr. wb., Syalom.',
                '',
                `Kepada Yth. ${guestName},`,
                '',
                'Dengan penuh rasa syukur, kami mengundang Bapak/Ibu/Saudara/i untuk hadir dan memberikan doa pada acara syukuran wisuda:',
                'Reza Effendy, S.Kom.',
                '',
                'Hari/Tanggal: Kamis, 12 November 2026',
                'Waktu: 01.00 WIT',
                'Tempat: Dumar (Area Mesjid Al-Jihad), Tual',
                '',
                'Informasi lengkap dan konfirmasi kehadiran dapat dilihat melalui undangan berikut:',
                invitationUrl.href,
                '',
                'Terima kasih.'
            ].join('\n');
            whatsappShare.href = `https://wa.me/?text=${encodeURIComponent(invitationMessage)}`;
            result.hidden = false;
            statusMessage.textContent = 'Link siap dibagikan kepada tamu.';
        });

        copyButton.addEventListener('click', async () => {
            generatedLinkInput.focus();
            generatedLinkInput.select();

            try {
                await navigator.clipboard.writeText(generatedLinkInput.value);
                statusMessage.textContent = 'Link berhasil disalin.';
            } catch (error) {
                const copied = document.execCommand('copy');
                statusMessage.textContent = copied
                    ? 'Link berhasil disalin.'
                    : 'Link tidak dapat disalin otomatis. Silakan salin link yang tampil.';
            }
        });
    </script>
</body>
</html>
